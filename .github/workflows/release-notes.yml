name: Release Notes

# リリースが公開されたら、最新リリースのノートを Claude でまとめて書き換える。
# 手動実行 (workflow_dispatch) した場合も最新リリースだけが対象。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  id-token: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  release-notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      EVENT_TAG: ${{ github.event.release.tag_name }}
      WORK_DIR: .release-notes
    steps:
      - name: Resolve latest release
        id: latest
        run: |
          # dev からのリリースはプレリリースになるため、プレリリースも含めて一番新しいものを最新とする
          latest=$(gh release list --repo "$REPO" --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')
          if [ -z "$latest" ]; then
            echo "::error::No published release found."
            exit 1
          fi
          if [ -n "$EVENT_TAG" ] && [ "$EVENT_TAG" != "$latest" ]; then
            echo "::notice::$EVENT_TAG is not the latest release ($latest). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.latest.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Collect PRs and commits
        if: steps.latest.outputs.skip != 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          mkdir -p "$WORK_DIR"

          # GitHub の自動生成ノート (What's Changed / Full Changelog) を取得
          gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" -q .body > "$WORK_DIR/generated.md"
          cat "$WORK_DIR/generated.md"

          # 自動生成ノートに含まれる PR の詳細を取得
          for pr in $(grep -oE '/pull/[0-9]+' "$WORK_DIR/generated.md" | grep -oE '[0-9]+' | sort -un); do
            gh pr view "$pr" --repo "$REPO" --json number,title,body,labels,author,url
          done | jq -s '.' > "$WORK_DIR/prs.json"

          # PR を経由しない変更も拾えるようにコミット一覧も渡す
          prev=$(grep -oE 'compare/[^ )]+\.\.\.' "$WORK_DIR/generated.md" | head -n1 | sed -E 's#compare/##; s#\.\.\.$##')
          if [ -n "$prev" ]; then
            git log --no-merges --format='- %s (%h)' "$prev..$TAG" > "$WORK_DIR/commits.md"
          else
            git log --no-merges --format='- %s (%h)' "$TAG" > "$WORK_DIR/commits.md"
          fi

      - name: Summarize with Claude
        if: steps.latest.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --allowedTools "Read,Write"
          prompt: |
            リリース ${{ steps.latest.outputs.tag }} のリリースノートの日本語サマリーを作成してください。

            入力ファイル:
            - ${{ env.WORK_DIR }}/generated.md : GitHub が自動生成した PR 一覧
            - ${{ env.WORK_DIR }}/prs.json : 各 PR のタイトル・本文・ラベル
            - ${{ env.WORK_DIR }}/commits.md : 前回リリースからのコミット一覧

            これらを読み、このバージョンでの変更をユーザー向けに要約して
            ${{ env.WORK_DIR }}/summary.md に書き出してください。

            形式 (Markdown):
            ### 改善・修正
            - ダークモードで取り消しトーストが明るい帯になる問題を修正

            ルール:
            - 見出しは「### 新機能」「### 改善・修正」「### その他」のうち該当するものだけを使う (該当しない見出しは出さない)
            - 各項目は日本語で 1 行、ユーザーから見た変化として簡潔に書く
            - PR 番号・作者名・コミットハッシュは書かない
            - CI やリポジトリ設定など、アプリ利用者に関係しない変更は「### その他」にまとめるか省略する
            - 「## ... の変更点」や「What's Changed」の見出しは書かない (ワークフロー側で付ける)
            - summary.md 以外のファイルは作成・変更しない

      - name: Update release notes
        if: steps.latest.outputs.skip != 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          if [ ! -s "$WORK_DIR/summary.md" ]; then
            echo "::error::summary.md was not generated."
            exit 1
          fi
          {
            echo "## $TAG の変更点"
            echo
            cat "$WORK_DIR/summary.md"
            echo
            echo
            cat "$WORK_DIR/generated.md"
          } > "$WORK_DIR/notes.md"
          cat "$WORK_DIR/notes.md"
          gh release edit "$TAG" --repo "$REPO" --notes-file "$WORK_DIR/notes.md"
